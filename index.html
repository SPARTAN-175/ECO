<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#050810"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/icon-192.png"><title>ECO</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#050810;color:#eef7ff;font-family:system-ui}body{touch-action:none}#app{height:100dvh;display:flex;flex-direction:column;background:radial-gradient(circle at 50% -20%,#1c3554,#050810 60%)}header{height:54px;display:flex;justify-content:space-between;align-items:center;padding:5px 14px;background:#070d17ed;border-bottom:1px solid #20334a}.brand{display:flex;align-items:center;gap:8px}.mark{width:31px;height:31px;border-radius:9px;background:linear-gradient(145deg,#6cf0d0,#719cff);color:#061017;display:grid;place-items:center;font-weight:1000}.brand b{letter-spacing:.16em}.brand small{display:block;font-size:7px;color:#8194ae}.hud{display:flex;gap:6px}.chip{padding:6px 8px;border:1px solid #2a3d59;border-radius:9px;background:#0d1725;font-size:10px;color:#9cafc8}.chip b{color:#fff}#stage{flex:1;min-height:0;display:grid;place-items:center;padding:6px;position:relative}canvas{width:min(100%,1180px);height:auto;max-height:calc(100dvh - 145px);aspect-ratio:31/21;border:1px solid #30435f;border-radius:14px;box-shadow:0 25px 90px #000b}#banner{position:absolute;top:12px;left:50%;transform:translateX(-50%);padding:7px 10px;background:#09111ddd;border:1px solid #30445e;border-radius:9px;color:#a6b7cc;font-size:9px}#controls{height:91px;display:flex;align-items:center;gap:10px;padding:4px 32px}.joy{width:78px;height:78px;border:1px solid #31445e;border-radius:50%;background:radial-gradient(circle,#182a40,#09111d);position:relative;touch-action:none}.knob{position:absolute;left:22px;top:22px;width:34px;height:34px;border-radius:50%;background:#70e2c6}.actions{flex:1;display:flex;
