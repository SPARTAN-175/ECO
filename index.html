<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#081321">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.svg">
<title>ECO — El tiempo te recuerda</title>
<style>
:root{--bg:#050a12;--panel:#091321;--line:#1d344c;--text:#edf5ff;--muted:#8197b0;--cyan:#54d8ff;--green:#65e6a8;--pink:#ff5d87;--violet:#8c7bff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{display:flex;justify-content:center}#app{width:min(100vw,960px);height:100dvh;display:flex;flex-direction:column;background:linear-gradient(160deg,#091522,#050a12)}
header{height:70px;flex:0 0 70px;padding:10px 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#08111eeF;z-index:2}
.logo{font-size:21px;font-weight:950;letter-spacing:5px}.tag{font-size:9px;letter-spacing:1.5px;color:var(--muted);margin-top:2px}.stats{display:flex;gap:6px}.pill{border:1px solid var(--line);background:#0c1a2b;padding:7px 9px;border-radius:11px;color:var(--muted);font-size:10px}.pill b{color:var(--text)}
#stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px}
canvas{width:100%;height:100%;max-width:900px;object-fit:contain;touch-action:none;border:1px solid #203750;border-radius:18px;background:#07101b;box-shadow:0 18px 70px #0009}
#toast{position:absolute;top:18px;left:50%;transform:translateX(-50%);padding:8px 12px;border:1px solid #294762;background:#0b1a2bee;border-radius:11px;font-size:11px;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap;z-index:3}
#controls{height:152px;flex:0 0 152px;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-top:1px solid var(--line);background:#08111e}
#stick{width:108px;height:108px;border-radius:50%;border:2px solid #29415c;background:#0c1b2c;position:relative;touch-action:none;flex:none}.knob{position:absolute;width:46px;height:46px;left:29px;top:29px;border-radius:50%;background:var(--cyan);box-shadow:0 0 22px #54d8ff55}
.actions{display:flex;gap:7px}.btn{border:1px solid #2b4560;background:#102137;color:#fff;border-radius:14px;min-width:73px;min-height:58px;padding:8px 7px;font-size:10px;font-weight:850}.btn:active{transform:scale(.96)}.primary{background:#12364a;border-color:#327e99}.danger{background:#261826}
.overlay{position:absolute;inset:0;background:#040910ef;display:flex;align-items:center;justify-content:center;z-index:10;padding:18px}.hidden{display:none!important}.card{width:min(94%,450px);max-height:90%;overflow:auto;background:#0b1727;border:1px solid #29445f;border-radius:24px;padding:24px;box-shadow:0 25px 100px #000b}.card h1{margin:0 0 4px;font-size:30px;letter-spacing:4px}.desc{font-size:13px;line-height:1.5;color:var(--muted)}.levels{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:18px 0}.level{border:1px solid #29415b;background:#101f33;color:white;border-radius:10px;aspect-ratio:1;font-size:11px;font-weight:850}.level.done{border-color:var(--green);box-shadow:inset 0 0 0 1px #65e6a822}.level.lock{opacity:.28}.wide{width:100%;margin-top:8px}.progress{height:7px;background:#122237;border-radius:20px;overflow:hidden;margin:14px 0}.progress i{display:block;height:100%;background:var(--cyan);width:0}.center{text-align:center}.big{font-size:48px;font-weight:950;letter-spacing:3px}.hint{font-size:11px;color:#6e849d;margin-top:10px}
</style>
</head>
<body>
<div id="app">
<header>
 <div><div class="logo">ECO</div><div class="tag">EL TIEMPO TE RECUERDA</div></div>
 <div class="stats"><div class="pill">NIVEL <b id="levelNo">1</b></div><div class="pill">ECOS <b id="echoNo">0</b></div><div class="pill">★ <b id="doneNo">0</b>/120</div></div>
</header>
<div id="stage">
 <canvas id="game" width="720" height="540"></canvas><div id="toast"></div>
 <section id="menu" class="overlay"><div class="card">
  <h1>ECO</h1><div class="desc">Tu pasado repite tus movimientos. Haz que tus Ecos mantengan los botones activos y encuentra la salida. Hay <b>120 pruebas</b> y cada bloque introduce una nueva combinación.</div>
  <div class="progress"><i id="bar"></i></div><div class="small" id="progressText"></div>
  <div class="levels" id="levels"></div>
  <div class="hint">El progreso se guarda automáticamente en este dispositivo.</div>
 </div></section>
 <section id="win" class="overlay hidden"><div class="card center">
   <div class="big">✓</div><h1 id="winTitle">CONSEGUIDO</h1><div class="desc" id="winText"></div>
   <button id="next" class="btn primary wide">SIGUIENTE NIVEL</button><button id="map" class="btn wide">MAPA DE NIVELES</button>
 </div></section>
</div>
<div id="controls">
 <div id="stick"><div class="knob"></div></div>
 <div class="actions"><button id="echo" class="btn primary">●<br>CREAR ECO</button><button id="restart" class="btn">↻<br>REINICIAR</button><button id="levelsBtn" class="btn danger">☰<br>NIVELES</button></div>
</div>
</div>
<script>
let LEVELS=[], level=0, completed=Number(localStorage.getItem('ecoCompleted')||0);
let p,rec,echoes,t,last=0,won=false,keys={},touch={x:0,y:0};
const C=document.getElementById('game'),ctx=C.getContext('2d'),W=720,H=540;
const $=id=>document.getElementById(id);
fetch('levels.json').then(r=>r.json()).then(data=>{LEVELS=data;renderMap();openMap();});
function current(){return LEVELS[level]}
function openMap(){$('menu').classList.remove('hidden');$('win').classList.add('hidden');renderMap()}
function renderMap(){
 if(!LEVELS.length)return;
 $('doneNo').textContent=completed;$('bar').style.width=(completed/120*100)+'%';$('progressText').textContent=completed+' de 120 pruebas superadas';
 let box=$('levels');box.innerHTML='';
 LEVELS.forEach((l,i)=>{let b=document.createElement('button');b.className='level '+(i<completed?'done':'')+(i>completed?' lock':'');b.textContent=i+1;b.disabled=i>completed;b.onclick=()=>{level=i;$('menu').classList.add('hidden');start()};box.appendChild(b)})
}
function start(){let l=current();p={x:l.start[0],y:l.start[1],r:15};rec=[];echoes=[];t=0;won=false;last=performance.now();$('levelNo').textContent=l.id;$('echoNo').textContent=0;$('win').classList.add('hidden');toast(l.title+' · '+l.hint);requestAnimationFrame(loop)}
function collision(x,y,r){for(const w of current().walls){let cx=Math.max(w[0],Math.min(x,w[0]+w[2])),cy=Math.max(w[1],Math.min(y,w[1]+w[3]));if((x-cx)**2+(y-cy)**2<r*r)return true}return false}
function move(o,dx,dy){let nx=o.x+dx;if(!collision(nx,o.y,o.r))o.x=nx;let ny=o.y+dy;if(!collision(o.x,ny,o.r))o.y=ny}
function input(){let x=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0)+touch.x,y=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0)+touch.y,n=Math.hypot(x,y);return n>1?{x:x/n,y:y/n}:{x,y}}
function frame(){rec.push({t,x:p.x,y:p.y})}
function makeEcho(){if(rec.length<8){toast('Muévete antes de crear un Eco.');return}echoes.push({f:rec.slice(),a:0});rec=[];t=0;$('echoNo').textContent=echoes.length;toast('Eco '+echoes.length+' creado');}
function epos(e){let f=e.f,z=e.a;if(z<=f[0].t)return f[0];for(let i=1;i<f.length;i++){if(z<=f[i].t){let a=f[i-1],b=f[i],q=(z-a.t)/(b.t-a.t||1);return{x:a.x+(b.x-a.x)*q,y:a.y+(b.y-a.y)*q}}}return f[f.length-1]}
function active(){return current().buttons.map(b=>echoes.some(e=>{let q=epos(e);return Math.hypot(q.x-b[0],q.y-b[1])<38}))}
function update(dt){if(won)return;t+=dt;if(t>=current().cycle){if(rec.length>8)makeEcho();else{t=0;rec=[]}}let v=input();move(p,v.x*150*dt,v.y*150*dt);frame();echoes.forEach(e=>{e.a+=dt;if(e.a>e.f[e.f.length-1].t)e.a=0});let ok=active().every(Boolean),ex=current().exit;if(ok&&p.x>ex[0]-18&&p.x<ex[0]+75&&p.y>ex[1]-18&&p.y<ex[1]+75){complete();return}draw(ok)}
function complete(){won=true;if(level===completed)completed=Math.min(120,completed+1);localStorage.setItem('ecoCompleted',completed);renderMap();$('winTitle').textContent=level===119?'¡120 PRUEBAS!':'CONSEGUIDO';$('winText').textContent='Prueba '+current().id+' superada. '+(level<119?'El siguiente reto ya está desbloqueado.':'Has completado toda la campaña inicial de ECO.');$('next').textContent=level<119?'SIGUIENTE NIVEL':'MAPA DE NIVELES';$('win').classList.remove('hidden')}
function draw(open){ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#091625');g.addColorStop(1,'#060d17');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#10243a';for(let x=62;x<660;x+=32){ctx.beginPath();ctx.moveTo(x,62);ctx.lineTo(x,478);ctx.stroke()}for(let y=62;y<478;y+=32){ctx.beginPath();ctx.moveTo(62,y);ctx.lineTo(658,y);ctx.stroke()}ctx.fillStyle='#172c43';current().walls.forEach(w=>ctx.fillRect(...w));let a=active();current().buttons.forEach((b,i)=>{ctx.beginPath();ctx.arc(b[0],b[1],22,0,7);ctx.fillStyle=a[i]?'#65e6a8':'#ff5d87';ctx.fill();ctx.fillStyle='#07111d';ctx.beginPath();ctx.arc(b[0],b[1],7,0,7);ctx.fill()});let ex=current().exit;ctx.fillStyle=open?'#65e6a8':'#253a52';ctx.fillRect(ex[0],ex[1],55,55);ctx.fillStyle='#07111d';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText(open?'ABIERTO':'SALIDA',ex[0]+27,ex[1]+33);echoes.forEach((e,i)=>{let q=epos(e);ctx.beginPath();ctx.arc(q.x,q.y,16,0,7);ctx.fillStyle='rgba(140,123,255,.2)';ctx.fill();ctx.strokeStyle='#8c7bff';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#c4beff';ctx.font='9px system-ui';ctx.fillText('ECO '+(i+1),q.x,q.y-23)});ctx.beginPath();ctx.arc(p.x,p.y,15,0,7);ctx.fillStyle='#54d8ff';ctx.fill();ctx.strokeStyle='#e2faff';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#06101b';ctx.beginPath();ctx.arc(p.x+5,p.y-3,3,0,7);ctx.fill()}
function loop(now){let dt=Math.min(.035,(now-last)/1000);last=now;update(dt);requestAnimationFrame(loop)}
function toast(s){let e=$('toast');e.textContent=s;e.style.opacity=1;clearTimeout(window._t);window._t=setTimeout(()=>e.style.opacity=0,1700)}
addEventListener('keydown',e=>keys[e.key]=true);addEventListener('keyup',e=>keys[e.key]=false);
$('echo').onclick=makeEcho;$('restart').onclick=start;$('levelsBtn').onclick=openMap;$('map').onclick=openMap;$('next').onclick=()=>{if(level<119){level++;start()}else openMap()};
const st=$('stick'),kn=st.querySelector('.knob');function sm(e){let r=st.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),n=Math.hypot(dx,dy),m=34;if(n>m){dx=dx/n*m;dy=dy/n*m}kn.style.transform=`translate(${dx}px,${dy}px)`;touch.x=dx/m;touch.y=dy/m}function se(){touch.x=touch.y=0;kn.style.transform='translate(0,0)'}st.addEventListener('pointerdown',e=>{st.setPointerCapture(e.pointerId);sm(e)});st.addEventListener('pointermove',e=>{if(e.buttons)sm(e)});st.addEventListener('pointerup',se);st.addEventListener('pointercancel',se);
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body></html>
