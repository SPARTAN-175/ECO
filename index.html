<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="theme-color" content="#070b12"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/icon-192.svg"><title>ECO — Echo Puzzle</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#070b12;color:#eef5ff;font-family:system-ui,sans-serif}#app{height:100%;max-width:1100px;margin:auto;display:flex;flex-direction:column}header{height:60px;display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid #203047;background:#0a101a}.brand{font-weight:900;letter-spacing:.18em}.brand small{display:block;color:#8fa2bd;font-size:9px;letter-spacing:.12em}.hud{display:flex;gap:7px}.pill{background:#101a28;border:1px solid #2a3b55;border-radius:10px;padding:7px 10px;font-size:12px}.pill b{color:#6cf0d0}#wrap{position:relative;flex:1;min-height:0;display:grid;place-items:center;padding:8px}canvas{width:min(100%,930px);height:auto;max-height:calc(100vh - 155px);aspect-ratio:31/21;background:#080d16;border:1px solid #2a3b55;border-radius:15px;touch-action:none}#controls{height:95px;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;gap:10px}#joy{width:76px;height:76px;border-radius:50%;background:#101a28;border:1px solid #2a3b55;position:relative;touch-action:none}#knob{width:32px;height:32px;border-radius:50%;background:#6cf0d0;position:absolute;left:21px;top:21px}.actions{display:flex;gap:7px;flex:1;justify-content:center}.action{padding:11px 12px;border-radius:11px;background:#101a28;border:1px solid #2a3b55;font-weight:800;font-size:11px}.primary{border-color:#3b9485;background:#173a38;color:#b9fff1}#hint{width:76px;color:#8fa2bd;text-align:center;font-size:9px;line-height:1.3}#win{display:none;position:absolute;inset:0;place-items:center;background:#050911dd;z-index:5}.card{width:min(90%,420px);padding:25px;border-radius:19px;background:#0d1725;border:1px solid #30435f;text-align:center}.card p{color:#8fa2bd}.card button{padding:12px;border-radius:10px;border:1px solid #2a3b55;background:#162338;margin:4px;color:white}.go{background:#1a5a50!important}</style></head><body><div id="app"><header><div class="brand">ECO<small>YOUR PAST IS YOUR TOOL</small></div><div class="hud"><div class="pill">NIVEL <b id="ln">1</b>/120</div><div class="pill">ECOS <b id="ec">0</b></div></div></header><div id="wrap"><canvas id="game" width="930" height="630"></canvas><div id="win"><div class="card"><h1>✓ Nivel superado</h1><p id="wt"></p><button id="retry">Repetir</button><button class="go" id="next">Siguiente →</button></div></div></div><div id="controls"><div id="joy"><div id="knob"></div></div><div class="actions"><button class="action primary" id="eco">CREAR ECO</button><button class="action" id="reset">REINICIAR</button></div><div id="hint">Llega a un botón<br>y fija un ECO</div></div></div><script src="game.js"></script></body></html>
