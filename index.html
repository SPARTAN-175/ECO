<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#050810"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/icon-192.png"><title>ECO — Laberinto</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050810;color:#eef7ff;font-family:system-ui,sans-serif}body{touch-action:none}#app{height:100dvh;display:flex;flex-direction:column;background:radial-gradient(circle at 50% -20%,#1c3554,#050810 65%)}header{height:52px;min-height:52px;display:flex;align-items:center;justify-content:space-between;padding:5px 14px;background:#070d17ee;border-bottom:1px solid #20334a}.brand{display:flex;gap:8px;align-items:center}.mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(145deg,#6cf0d0,#719cff);display:grid;place-items:center;color:#061017;font-weight:1000}.brand b{font-size:14px;letter-spacing:.15em}.brand small{display:block;color:#8295ae;font-size:7px}.hud{display:flex;gap:5px}.chip{background:#0d1725;border:1px solid #2a3d59;border-radius:9px;padding:5px 7px;font-size:9px;color:#9cafc8}.chip b{color:#fff}#stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:5px}#game{display:block;width:auto;height:auto;max-width:100%;max-height:100%;aspect-ratio:31/21;border:1px solid #30435f;border-radius:14px;background:#080e17;box-shadow:0 25px 90px #000b}#banner{position:absolute;top:10px;left:50%;transform:translateX(-50%);padding:7px 10px;background:#09111ddd;border:1px solid #30445e;border-radius:9px;color:#a6b7cc;font-size:9px;white-space:nowrap;pointer-events:none}#controls{height:88px;min-height:88px;display:flex;align-items:center;gap:10px;padding:4px 32px}#joy{width:74px;height:74px;flex:0 0 74px;border-radius:50%;background:radial-gradient(circle,#182a40,#09111d);border:1px solid #31445e;position:relative;touch-action:none}#knob{position:absolute;left:20px;top:20px;width:34px;height:34px;border-radius:50%;background:#67dfc2;box-shadow:0 0 18px #62f2d277}.actions{display:flex;justify-content:center;gap:7px;flex:1}.btn{padding:11px 13px;border-radius:11px;border:1px solid #2a3e59;background:#0e1827;color:#e8f1fa;font-weight:900;font-size:10px}.primary{border-color:#3d9f8d;background:#16443d;color:#baffef}.danger{border-color:#713443;color:#ffb1bd}#modal{display:none;position:absolute;inset:0;z-index:5;place-items:center;background:#02050bdf;backdrop-filter:blur(8px)}.card{width:min(88%,430px);padding:24px;border:1px solid #344a65;border-radius:20px;background:#0b1523;text-align:center}.card h1{margin:7px 0}.card p{color:#91a6c0}.row{display:flex;gap:7px}.row button{flex:1}@media(max-width:700px){.brand small{display:none}.brand b{font-size:13px}.chip{padding:5px}.btn{padding:10px 9px;font-size:9px}}</style></head><body><div id="app"><header><div class="brand"><div class="mark">E</div><div><b>ECO</b><small>YOUR PAST IS YOUR TOOL</small></div></div><div class="hud"><div class="chip">NIVEL <b id="lv">1</b>/120</div><div class="chip">❤️ <b id="hp">3</b></div><div class="chip">👻 <b id="ec">0</b></div></div></header><main id="stage"><canvas id="game" width="930" height="630"></canvas><div id="banner">Encuentra el núcleo y evita a los guardianes.</div><div id="modal"><div class="card"><b style="color:#6cf0d0">LABERINTO COMPLETADO</b><h1 id="mt">NIVEL SUPERADO</h1><p id="mm"></p><div class="row"><button class="btn" id="again">REPETIR</button><button class="btn primary" id="next">SIGUIENTE →</button></div><button class="btn" id="mute">🔊 MÚSICA</button></div></div></main><footer id="controls"><div id="joy"><div id="knob"></div></div><div class="actions"><button class="btn primary" id="make">CREAR ECO</button><button class="btn danger" id="reset">REINICIAR</button></div></footer></div><script src="music.js"></script><script src="game.js"></script></body></html>
